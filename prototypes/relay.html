<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#F6F5F1;--navy:#182E44;--coral:#EB8B79;--coral2:#C8715F;--green:#4E6B55;--brown:#9B5E4F;--line:#E6E5DF;--mute:#6B7B88;--f:'DM Sans','Segoe UI',system-ui,sans-serif;--d:'DM Serif Display',Georgia,serif;--s:'Source Serif 4',Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--f)}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh;max-width:1500px;margin:0 auto}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{flex-direction:row!important;flex-wrap:wrap;height:auto!important;position:static!important}.side .btn{display:none}}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font:600 19px var(--f);letter-spacing:.14em;margin:0 6px 22px}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.nav{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font:500 14.5px var(--f);color:#4D5F6E;border:0;background:none;cursor:pointer;text-align:left}
.nav[aria-current=page]{background:var(--navy);color:#fff}.nav:focus-visible,.btn:focus-visible,textarea:focus-visible,.ls:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.nav.dim{opacity:.45;cursor:default}
.btn{font:600 14px var(--f);border-radius:12px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy)}.btn.c{background:var(--coral);border-color:var(--coral);color:var(--navy)}
.side .btn{margin-top:auto}
main{padding:28px 32px 44px;min-width:0}
.eb{font:400 11px var(--s);letter-spacing:.2em;text-transform:uppercase;color:#7D8A95}
h1{font:400 clamp(30px,4vw,44px)/1.1 var(--d);margin:8px 0 0;letter-spacing:-.02em}h1 em{color:var(--coral2);font-style:normal}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px}
.score{display:grid;grid-template-columns:200px 1fr;gap:26px;padding:26px;align-items:center}
@media (max-width:700px){.score{grid-template-columns:1fr}}
.rb{display:grid;grid-template-columns:96px 1fr 34px;gap:14px;align-items:center;font-size:14px;margin:9px 0;color:#4D5F6E}
.bar{height:6px;border-radius:4px;background:#EEF0EE}.bar i{display:block;height:100%;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}}
.st{padding:16px 18px}.st .eb{font-size:10px}.st b{display:block;font:600 32px var(--f);letter-spacing:-.03em;margin:6px 0 2px}.st small{font:400 13px var(--s);color:var(--mute)}
.st.dark{background:var(--navy);color:#fff}.st.dark .eb,.st.dark small{color:#B7C8D6}
.lessons{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:900px){.lessons{grid-template-columns:1fr}}
.lh{padding:14px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.ls{display:flex;gap:16px;align-items:center;padding:16px 20px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.ls:first-of-type{border-top:0}.ls:hover{background:#FAF9F6}
.sc{width:46px;height:46px;border:1.5px solid;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 17px var(--f);flex:none}
.ls b{font:600 15px var(--f);display:block}.ls small{font:400 13px var(--s);color:var(--mute)}
.badge{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font:500 12.5px var(--s);color:#4D5F6E;background:#EDF1F3}
.back{font:500 14px var(--f);color:var(--mute);background:none;border:0;cursor:pointer;padding:0;margin-bottom:12px}
.tr{padding:22px 26px;display:grid;gap:12px;max-height:560px;overflow:auto}
.turn{display:grid;grid-template-columns:78px 1fr;gap:12px;font:400 15.5px/1.55 var(--s)}
.turn b{font:700 12px var(--f);letter-spacing:.06em;color:var(--mute)}
.turn.t{background:#FBF3F0;border-radius:12px;padding:8px 12px}.turn.t b{color:var(--coral2)}
mark.q{background:#FFE2D9;border-radius:4px;padding:0 3px}
textarea{width:100%;min-height:200px;font:400 14.5px/1.5 var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--navy);background:#fff;resize:vertical}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}@media (max-width:700px){.res{grid-template-columns:1fr 1fr}}
.note{font:400 13.5px/1.5 var(--s);color:var(--mute);margin-top:14px}
.hint{padding:20px}.hint p{font:400 15px/1.5 var(--s);color:#4D5F6E}
.foot{font:400 13px var(--s);color:#8C99A3;margin-top:22px}
</style></head><body><div class="app">
<nav class="side" aria-label="Relay"><div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l8-13 8 13M8.5 12.5h7"/></svg></i>RELAY</div>
<button class="nav" data-v="ov" aria-current="page">Overview</button><button class="nav" data-v="ls">Lessons</button><button class="nav" data-v="im">Analyse a transcript</button><button class="nav dim" disabled>Live</button><button class="nav dim" disabled>Behaviour</button><button class="nav dim" disabled>Misconceptions</button><button class="nav dim" disabled>Insights</button><button class="btn c" id="go">Analyse a transcript</button></nav>
<main id="m"></main></div>
<script>
(function(){
var LES=[{id:0,sc:92,t:'The Industrial Revolution and public health',m:'History · Year 10 · 21 Sept · 20 min',b:'no exit ticket',o:78,w:3.4,r:46,
 tr:[['T','Right, today we ask why cities got dangerous so fast. What do you think happened to the water supply when thousands of people moved in?'],['S','It got dirty?'],['T','Say more. What would be in it, and how do you know?'],['S','Sewage, because there were no pipes for it.'],['T','Good. Why might that matter more in a crowded street than a village?'],['S','Because it spreads quicker.'],['T','Explain how it spreads. Take a moment before you answer.']]},
{id:1,sc:55,t:'Balancing chemical equations',m:'Science · Year 9 · 18 Sept · 25 min',b:'35% mastery',o:31,w:1.6,r:71,
 tr:[['T','Today we balance equations. Is this one balanced? Yes or no?'],['S','No.'],['T','Right. How many oxygen atoms on the left? Two. And on the right? Three. So what do we do?'],['S','Add a number?'],['T','Yes, a coefficient. Is that clear? Does everyone understand? Good, so put a two in front. Is it balanced now?'],['S','Yes.'],['T','Correct. Next one. Are the hydrogens equal?']]},
{id:2,sc:43,t:'Ratio and proportion problems',m:'Maths · Year 8 · 14 Sept · 28 min',b:'42% mastery',o:22,w:1.2,r:78,
 tr:[['T','Is the ratio three to two? Yes. Do you remember sharing in a ratio? Good. Which number do we divide by? Five. Is it five?'],['S','Yes.'],['T','Right. So how many in each part? Twelve. Is that right? Yes.'],['S','Twelve.'],['T','Now you try. What is twelve times three? Thirty-six. Next question.']]}];
var OPEN=/^(why|how|explain|what do you think|describe|what would|what might|say more|tell me|in what way|what makes)/i;
var m=document.getElementById('m'),view='ov',cur=null;
function ring(v){var c=2*Math.PI*52,o=c*(1-v/100);return'<svg width="170" height="170" viewBox="0 0 140 140"><circle cx="70" cy="70" r="52" fill="none" stroke="#EEF0EE" stroke-width="9"/><circle cx="70" cy="70" r="52" fill="none" stroke="#EB8B79" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+o+'" transform="rotate(-90 70 70)"/><text x="70" y="76" text-anchor="middle" font-family="DM Serif Display,Georgia,serif" font-size="38" fill="#182E44">'+v+'</text><text x="70" y="96" text-anchor="middle" font-family="Source Serif 4,Georgia,serif" font-size="8" letter-spacing="1.6" fill="#7D8A95">LAST 5</text></svg>'}
function analyse(turns){var T=turns.filter(function(x){return x[0]==='T'}),q=0,open=0,wT=0,wS=0;
  turns.forEach(function(x){var w=x[1].split(/\s+/).filter(Boolean).length;if(x[0]==='T')wT+=w;else wS+=w});
  var qs=[];T.forEach(function(x){(x[1].match(/[^.?!]+\?/g)||[]).forEach(function(s){s=s.trim();q++;var isO=OPEN.test(s);if(isO)open++;qs.push([s,isO])})});
  return{q:q,open:open,pct:q?Math.round(open/q*100):0,ratio:wT+wS?Math.round(wT/(wT+wS)*100):0,wT:wT,wS:wS,qs:qs,turns:turns.length}}
function bars(a){var rows=[['Questioning',Math.min(5,1+a.pct/100*4+.4)],['Checking',3.8],['Modelling',3.6],['Retrieval',2.6],['Feedback',3.2],['Wait time',3.4],['Practice',2.8]];
  return rows.map(function(r){var v=r[1],col=v>=3.5?'var(--green)':v>=3?'var(--coral2)':'var(--brown)';return'<div class="rb"><span>'+r[0]+'</span><div class="bar"><i style="width:'+(v/5*100)+'%;background:'+col+'"></i></div><span>'+v.toFixed(1)+'</span></div>'}).join('')}
function ov(){m.innerHTML='<div class="eb">Overview</div><div class="top"><h1>Your teaching, <em>in rhythm.</em></h1><div style="display:flex;gap:10px"><button class="btn" id="b1">Import transcript</button><button class="btn c" id="b2">Start live lesson</button></div></div>'+
 '<div class="card score"><div style="text-align:center">'+ring(76)+'</div><div><div class="eb">Delivery score</div><div style="font:400 16px var(--s);color:#4E6B55;margin:6px 0 10px">▲ 36 pts vs the previous five lessons</div>'+bars({pct:40})+'</div></div>'+
 '<div class="stats"><div class="card st dark"><div class="eb">Lessons analysed</div><b>12</b><small>4h 30m of talk</small></div><div class="card st"><div class="eb">Open questions</div><b style="color:var(--coral2)">40%</b><small>of substantive questions</small></div><div class="card st"><div class="eb">Mean wait time</div><b>2.3s</b><small>research target 3s or more</small></div><div class="card st"><div class="eb">Student mastery</div><b>53%</b><small>1 awaiting exit ticket</small></div></div>'+
 '<div class="lessons"><div class="card"><div class="lh"><span class="eb">Recent lessons</span><button class="back" style="margin:0" id="all">All lessons →</button></div>'+LES.map(function(l){return'<button class="ls" data-id="'+l.id+'"><span class="sc" style="color:'+(l.sc>=75?'var(--green)':'var(--coral2)')+'">'+l.sc+'</span><span><b>'+l.t+'</b><small>'+l.m+'</small></span><span class="badge">'+l.b+'</span></button>'}).join('')+'</div>'+
 '<div class="card hint"><div class="eb">Close the loop</div><p style="margin-top:10px">Upload exit-ticket results to see whether what you said translated into what students can do.</p></div></div>'+
 '<div class="foot">Open a lesson to see its question and talk measures, or analyse a transcript of your own.</div>';
 document.getElementById('b1').onclick=document.getElementById('b2').onclick=function(){go('im')};document.getElementById('all').onclick=function(){go('ls')};bind()}
function bind(){m.querySelectorAll('.ls').forEach(function(b){b.onclick=function(){cur=+b.dataset.id;go('ld')}})}
function ls(){m.innerHTML='<div class="eb">Lessons</div><div class="top"><h1>Every lesson, <em>measured.</em></h1></div><div class="card">'+LES.map(function(l){return'<button class="ls" data-id="'+l.id+'"><span class="sc" style="color:'+(l.sc>=75?'var(--green)':'var(--coral2)')+'">'+l.sc+'</span><span><b>'+l.t+'</b><small>'+l.m+'</small></span><span class="badge">'+l.b+'</span></button>'}).join('')+'</div>';bind()}
function ld(){var l=LES[cur],a=analyse(l.tr);m.innerHTML='<button class="back" id="bk">← All lessons</button><div class="eb">'+l.m+'</div><div class="top"><h1>'+l.t+'</h1></div>'+res(a)+'<div class="card tr" style="margin-top:14px">'+l.tr.map(function(x){return trn(x)}).join('')+'</div><div class="note">Questions are highlighted. Open questions start with words such as why, how, explain or describe, and give pupils something to think about.</div>';document.getElementById('bk').onclick=function(){go('ls')}}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function trn(x){var h=esc(x[1]);if(x[0]==='T')h=h.replace(/[^.?!]+\?/g,function(s){return'<mark class="q">'+s+'</mark>'});return'<div class="turn '+(x[0]==='T'?'t':'')+'"><b>'+(x[0]==='T'?'TEACHER':'PUPIL')+'</b><span>'+h+'</span></div>'}
function res(a){return'<div class="res"><div class="card st dark"><div class="eb">Questions asked</div><b>'+a.q+'</b><small>by the teacher</small></div><div class="card st"><div class="eb">Open questions</div><b style="color:var(--coral2)">'+a.pct+'%</b><small>'+a.open+' of '+a.q+'</small></div><div class="card st"><div class="eb">Teacher talk</div><b>'+a.ratio+'%</b><small>of words spoken</small></div><div class="card st"><div class="eb">Pupil words</div><b>'+a.wS+'</b><small>against '+a.wT+' from teacher</small></div></div>'}
function im(){m.innerHTML='<div class="eb">Analyse a transcript</div><div class="top"><h1>Paste a lesson, <em>see the rhythm.</em></h1></div><p style="font:400 16px/1.5 var(--s);color:#4D5F6E;max-width:640px;margin:0 0 14px">One line per turn. Start teacher lines with T: and pupil lines with S:</p><textarea id="ta" aria-label="Transcript" spellcheck="false">T: Today we are looking at fractions. What do you think happens when we add two fractions with different denominators?\nS: You add the tops and the bottoms?\nT: Let us test that. Why would one half plus one half not be two quarters?\nS: Because that is smaller than one half.\nT: Exactly. Explain what is going on in your own words.\nS: The pieces have to be the same size first.\nT: Is that clear? Does everyone understand?</textarea><div style="margin:12px 0"><button class="btn c" id="an">Analyse</button></div><div id="out"></div>';
  function run(){var t=document.getElementById('ta').value.split('\n').map(function(x){var mm=x.match(/^\s*([TS])\s*:\s*(.*)$/i);return mm?[mm[1].toUpperCase(),mm[2]]:null}).filter(Boolean),o=document.getElementById('out');
    if(!t.length){o.innerHTML='<p class="note" style="color:#B23A27">No turns found. Start each line with T: or S:</p>';return}
    var a=analyse(t);o.innerHTML=res(a)+'<div class="card" style="margin-top:14px;padding:6px 0">'+a.qs.map(function(q){return'<div class="ls" style="cursor:default"><span class="badge" style="margin:0;background:'+(q[1]?'#E4EFE7':'#F5ECE8')+';color:'+(q[1]?'#2F5B3C':'#8C4A3C')+'">'+(q[1]?'open':'closed')+'</span><span style="font:400 15px var(--s)">'+esc(q[0])+'</span></div>'}).join('')+(a.qs.length?'':'<div class="ls" style="cursor:default">No questions found in the teacher turns.</div>')+'</div>'}
  document.getElementById('an').onclick=run;run()}
function go(v){view=v;m.parentNode.querySelectorAll('.nav').forEach(function(n){n.removeAttribute('aria-current')});var k=v==='ld'?'ls':v;var n=document.querySelector('.nav[data-v="'+k+'"]');if(n)n.setAttribute('aria-current','page');({ov:ov,ls:ls,ld:ld,im:im})[v]();window.scrollTo(0,0)}
document.querySelectorAll('.nav[data-v]').forEach(function(n){n.onclick=function(){go(n.dataset.v)}});document.getElementById('go').onclick=function(){go('im')};
go('ov');
})();
</script></body></html>
