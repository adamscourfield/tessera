<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--fg:#0F1115;--mute:#6B7280;--line:#E6E7EA;--hover:#F4F4F5;--red:#6E4AE0;--f:'Inter',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f);min-height:100vh}
button{font-family:var(--f);color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh;max-width:1500px;margin:0 auto}
.l{border-right:1px solid var(--line);padding:22px 22px 32px;display:flex;flex-direction:column}
.logo{display:flex;gap:12px;align-items:center}.logo b{display:block;font:700 15px var(--f);letter-spacing:.1em}.logo small{display:block;font:400 10px var(--m);letter-spacing:.14em;color:var(--mute)}
.lh{font:500 10.5px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:24px 0 8px}
.pl{display:flex;flex-direction:column;gap:2px}
.pl button{text-align:left;border:0;border-left:3px solid transparent;background:none;border-radius:8px;padding:9px 12px;font:500 14px var(--f);cursor:pointer;color:#4B5260}
.pl button[aria-pressed=true]{background:var(--hover);color:var(--fg);font-weight:600;border-left-color:var(--fg)}
.av{width:64px;height:64px;border-radius:12px;background:var(--fg);color:#fff;font:600 28px var(--f);display:flex;align-items:center;justify-content:center;margin-top:26px}
h1{font:600 32px/1.1 var(--f);letter-spacing:-.04em;margin-top:16px}h1 span{color:var(--red)}
.sn{font-size:14px;color:var(--mute);margin-top:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pill{border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:500 11.5px var(--f);color:#4B5260}.pill.f{border-color:#D5CBF8;color:#5634C4;background:#F4F1FE}
.q{margin-top:22px;background:#23262D;color:#ECEEF1;border-left:3px solid var(--red);border-radius:12px;padding:18px 20px;font-size:15px;line-height:1.6}
.q small{display:block;margin-top:10px;font:500 10.5px var(--m);letter-spacing:.12em;text-transform:uppercase;color:#B6A4F5}
.rev{margin-top:auto;padding-top:24px;font-size:13px;color:var(--mute)}
.r{padding:28px 32px 48px;min-width:0}
.eb{font:500 11px var(--m);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.hd h2{font:600 clamp(30px,4vw,40px)/1.1 var(--f);letter-spacing:-.04em;margin-top:8px}.hd h2 span{color:var(--red)}
.btn{background:var(--fg);color:#fff;border:1px solid var(--fg);border-radius:10px;padding:12px 20px;font:600 14px var(--f);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:24px}
.t{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;position:relative}
.ic{flex:none;width:36px;height:36px;border-radius:8px;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--fg)}
.t b{font:600 15px var(--f);display:block;line-height:1.3;padding-right:18px}.t span{font-size:13px;color:var(--mute);display:block;margin-top:4px;line-height:1.45}
.x{position:absolute;top:8px;right:8px;border:0;background:none;color:#9AA0AA;font-size:18px;cursor:pointer;line-height:1;padding:4px 7px;border-radius:6px}.x:hover{color:var(--fg);background:var(--hover)}
.no{margin-top:12px;border:1px solid #D5CBF8;background:#F4F1FE;border-radius:12px;padding:14px 18px;display:flex;gap:8px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.no h6{font:500 10.5px var(--m);letter-spacing:.12em;text-transform:uppercase;color:#5634C4;margin-right:8px}
.no span{background:#fff;border:1px solid #D5CBF8;border-radius:6px;padding:4px 10px;color:#4B5260}
.add{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font:500 14px var(--f);color:var(--fg)}
.add button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 18px;font:600 14px var(--f);cursor:pointer}
.sup{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;margin-top:24px}
.card{border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.card h3{font:600 17px var(--f);letter-spacing:-.02em;margin-bottom:16px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 130px 64px;gap:12px;align-items:center;font-size:14px;padding:10px 0;border-top:1px solid var(--line)}
.bar{height:6px;background:var(--hover);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--fg);border-radius:4px;transition:width .3s}
.st{display:flex;gap:4px}.st button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;line-height:1}
.rd{display:flex;gap:6px;flex-wrap:wrap}
.rd button{width:40px;height:40px;border-radius:8px;background:var(--fg);color:#fff;border:1px solid var(--fg);font:600 12px var(--f);cursor:pointer}
.rd button.n{background:#fff;border:1px dashed #C4C7CD;color:var(--mute)}
.rdt{margin-top:14px;font-size:13.5px;color:var(--mute);line-height:1.5}.rdt b{color:var(--fg);font-weight:600}
.vw{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute);flex-wrap:wrap}
.vw select{font:500 14px var(--f);border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;color:var(--fg)}
.toast{margin-top:14px;font-size:14px;color:#1E6B3C;min-height:22px}
@media (max-width:900px){.app{grid-template-columns:1fr}.l{border-right:0;border-bottom:1px solid var(--line)}.pl{flex-direction:row;flex-wrap:wrap}.r{padding:24px 16px 40px}.sup{grid-template-columns:1fr}.pr{grid-template-columns:minmax(0,1fr) 90px 64px}}
@media print{.l .pl,.lh,.logo,.btn,.add,.vw,.x,.st,.toast,.rd,.rdt{display:none!important}.app{display:block}.l{border:0}.q{background:#f2f2f2;color:#000}}
</style></head><body>
<div class="app">
<aside class="l"><div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E4AE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8.5 17h7"/></svg><div><b>PASSPORT</b><small>PUPIL PROFILES</small></div></div><div class="lh">Pupils</div><div class="pl" id="pl" role="group" aria-label="Choose a pupil"></div><div id="who"></div></aside>
<main class="r" id="main"></main></div>
<script>
(function(){
var staff=['Mrs Cole','Mr Patel','Ms Ortiz','Mr Brown','Mrs Lee','Ms Adeyemi','Mr Hale','Ms Reynolds','Mr Singh'];
var I={list:'☰',time:'◷',front:'▣',chat:'“',eye:'◉',book:'▤',ear:'◐',voice:'♪',clock:'◔',hand:'+'};
var P=[
{id:'a',f:'Aaliyah',s:'Rahman',yr:'Year 9',tags:['Speech and language','SEN support'],q:'"I like it when the teacher writes the steps down. I get lost if it\'s all talking."',qs:'In her words, September',rev:'Thursday 12 November',
 st:[['list','Steps on the board','Short and numbered, not only said out loud'],['time','Ten seconds to think','Before you ask her to answer'],['front','Sit near the front','Away from the door and the noise'],['chat','Check in quietly','One to one, not "does everyone get it?"']],
 no:['Long spoken instructions','Reading aloud without warning'],sup:[['Speech therapy group',80],['Vocabulary pre-teach',70],['Reading buddy',38]],read:[0,1,2,3,4,5]},
{id:'j',f:'Jacob',s:'Okafor',yr:'Year 8',tags:['ADHD','SEN support'],q:'"If I can move a bit and know what\'s coming next, I can focus."',qs:'In his words, October',rev:'Monday 30 November',
 st:[['clock','Show the lesson plan','Three chunks on the board with timings'],['hand','Give him a job','Hand out books or wipe the board'],['front','Seat him with a calm partner','Not next to the window'],['chat','Quiet reset signal','Agreed card on his desk, no public reminders']],
 no:['Waiting with nothing to do','Public reprimands'],sup:[['Break card',90],['Check-in with form tutor',60],['Homework club',45]],read:[1,2,4,7]},
{id:'m',f:'Maya',s:'Kowalczyk',yr:'Year 10',tags:['Dyslexia','Exam access arrangements'],q:'"Reading is slow, not hard. Give me the time and I get there."',qs:'In her words, September',rev:'Friday 4 December',
 st:[['book','Print on cream paper','Sans serif, size 14 or larger'],['time','Extra time, always','25% in class tests, as in exams'],['voice','Read the question aloud','If she asks, without fuss'],['list','Key words listed first','Subject vocabulary at the start of a topic']],
 no:['Copying long text from the board','Reading aloud cold'],sup:[['Reading intervention',55],['Laptop for extended writing',100],['Spelling strategies',40]],read:[0,3,5,6,7,8]},
{id:'o',f:'Oliver',s:'Grant',yr:'Year 7',tags:['Autism','EHCP'],q:'"Tell me if something is going to change. I don\'t like surprises."',qs:'In his words, October',rev:'Wednesday 18 November',
 st:[['clock','Warn about changes','Before lessons, not during them'],['list','Clear, literal language','Say exactly what you mean'],['front','A quiet place to go','Library pass for unstructured times'],['eye','No forced eye contact','He listens even when looking away']],
 no:['Sarcasm and idioms','Sudden seat changes'],sup:[['Social skills group',65],['Lunchtime club',85],['Key adult check-in',75]],read:[2,3,6]},
{id:'s',f:'Sofia',s:'Marin',yr:'Year 9',tags:['Hearing impairment'],q:'"I need to see your face when you talk."',qs:'In her words, September',rev:'Thursday 26 November',
 st:[['front','Front, left side','Her better ear faces the room'],['voice','Face the class when speaking','No talking while writing on the board'],['list','Captions on every video','Always on, before it starts'],['ear','Repeat pupil answers','She cannot hear questions from the back']],
 no:['Group talk in noisy rooms','Instructions given while walking'],sup:[['Teacher of the deaf visit',70],['Radio aid check',100],['Peer note-taker',50]],read:[0,1,2,3,4,5,6,7,8]}];
var cur=0,viewer=0,toast='';
var state=P.map(function(p){return{st:p.st.map(function(x){return x.slice()}),sup:p.sup.map(function(x){return x.slice()}),read:p.read.slice()}});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(){
 var p=P[cur],s=state[cur];
 var pl=document.getElementById('pl');pl.innerHTML='';
 P.forEach(function(q,i){var b=document.createElement('button');b.type='button';b.textContent=q.f;b.setAttribute('aria-pressed',i===cur);b.onclick=function(){cur=i;toast='';draw()};pl.appendChild(b)});
 document.getElementById('who').innerHTML='<div class="av" aria-hidden="true">'+p.f[0]+'</div><h1>'+p.f+'</h1><div class="sn">'+p.s+' · '+p.yr+'</div><div class="pills">'+p.tags.map(function(t,i){return'<div class="pill'+(i?'':' f')+'">'+esc(t)+'</div>'}).join('')+'</div><div class="q">'+esc(p.q)+'<small>'+esc(p.qs)+'</small></div><div class="rev">Next review: '+p.rev+'</div>';
 var m=document.getElementById('main');
 var h='<div class="hd"><div><div class="eb">Pupil passport</div><h2>How to teach me<span>.</span></h2></div><button class="btn" id="pr" type="button">Print one-page profile</button></div><div class="tiles">';
 s.st.forEach(function(x,i){h+='<div class="t"><div class="ic" aria-hidden="true">'+(I[x[0]]||'●')+'</div><div><b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span></div><button class="x" type="button" data-rm="'+i+'" aria-label="Remove '+esc(x[1])+'">×</button></div>'});
 h+='</div><div class="add"><input id="ni" placeholder="Add a strategy, e.g. Seat her near the board" aria-label="New strategy"><button id="na" type="button">Add strategy</button></div>';
 h+='<div class="no"><h6>Doesn\'t help</h6>'+p.no.map(function(n){return'<span>'+esc(n)+'</span>'}).join('')+'</div>';
 h+='<div class="sup"><div class="card"><h3>Support this term</h3>'+s.sup.map(function(x,i){return'<div class="pr"><span>'+esc(x[0])+'</span><div class="bar" role="progressbar" aria-valuenow="'+x[1]+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+x[1]+'%"></i></div><div class="st"><button type="button" data-d="-10,'+i+'" aria-label="Less for '+esc(x[0])+'">−</button><button type="button" data-d="10,'+i+'" aria-label="More for '+esc(x[0])+'">+</button></div></div>'}).join('')+'</div>';
 var n=s.read.length;
 h+='<div class="card"><h3>'+n+' of '+staff.length+' teachers have read this</h3><div class="rd">'+staff.map(function(t,i){var r=s.read.indexOf(i)>-1;return'<button type="button" class="'+(r?'':'n')+'" data-r="'+i+'" title="'+t+(r?' has read':' has not read')+'" aria-pressed="'+r+'">'+t.split(' ').map(function(w){return w[0]}).join('')+'</button>'}).join('')+'</div>';
 var un=staff.filter(function(t,i){return s.read.indexOf(i)<0});
 h+='<div class="rdt">'+(un.length?'Still to read: '+un.map(function(t){return'<b>'+t+'</b>'}).join(', '):'Everyone who teaches '+p.f+' has read this.')+'</div>';
 h+='<div class="vw">View as <select id="vs" aria-label="View as teacher">'+staff.map(function(t,i){return'<option value="'+i+'"'+(i===viewer?' selected':'')+'>'+t+'</option>'}).join('')+'</select><button class="btn" id="mr" type="button" style="padding:8px 14px;font-size:13px">'+(s.read.indexOf(viewer)>-1?'Mark as unread':'Mark as read')+'</button></div></div></div><div class="toast" role="status">'+toast+'</div>';
 m.innerHTML=h;
 m.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){s.st.splice(+b.dataset.rm,1);draw()}});
 m.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){var a=b.dataset.d.split(',');var x=s.sup[+a[1]];x[1]=Math.max(0,Math.min(100,x[1]+ +a[0]));draw()}});
 m.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){tog(+b.dataset.r)}});
 document.getElementById('vs').onchange=function(e){viewer=+e.target.value;draw()};
 document.getElementById('mr').onclick=function(){tog(viewer)};
 document.getElementById('pr').onclick=function(){window.print()};
 var add=function(){var v=document.getElementById('ni').value.trim();if(!v)return;s.st.push(['hand',v,'Added just now']);toast='Added to '+p.f+'\'s profile. '+staff.length-0+' teachers will see it.';toast='Added to '+p.f+'\'s profile.';draw()};
 document.getElementById('na').onclick=add;document.getElementById('ni').onkeydown=function(e){if(e.key==='Enter')add()}}
function tog(i){var s=state[cur],k=s.read.indexOf(i);if(k>-1)s.read.splice(k,1);else s.read.push(i);toast=staff[i]+(k>-1?' marked as not read.':' has read the profile.');draw()}
draw();
})();
</script></body></html>
