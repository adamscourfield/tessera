<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lectern</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--fg:#0F1115;--mute:#6B7280;--line:#E6E7EA;--hover:#F4F4F5;--red:#2F6BDB;--f:'Inter',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f);min-height:100vh}
button,input,textarea{font-family:var(--f)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 290px;max-width:1500px;margin:0 auto;min-height:100vh}
.rail{min-width:0;border-right:1px solid var(--line);padding:22px 12px}.cm{min-width:0;border-left:1px solid var(--line);padding:24px 20px}
.logo{display:flex;gap:12px;align-items:center;margin:0 10px 6px}.logo b{display:block;font:700 15px var(--f);letter-spacing:.1em}.logo small{display:block;font:400 10px var(--m);letter-spacing:.14em;color:var(--mute)}
.rail h5{font:500 10.5px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:22px 12px 6px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:8px;color:#4B5260;font:500 14px var(--f);padding:9px 12px;cursor:pointer}
.nav button[aria-current=true]{background:var(--hover);color:var(--fg);font-weight:600;border-left-color:var(--fg)}
.ev div{font-size:13px;color:var(--mute);padding:6px 12px}
.mid{min-width:0;padding:20px 32px 48px;background:#FAFAFA}
.act{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.act span{font-size:13px;color:var(--mute);margin-right:auto}
.act button{font:600 14px var(--f);border:1px solid var(--line);padding:10px 18px;border-radius:10px;background:#fff;color:var(--fg);cursor:pointer}.act .p{background:var(--fg);color:#fff;border-color:var(--fg)}
.page{background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:clamp(24px,4vw,56px) clamp(20px,5vw,64px) 48px;min-height:700px}
.eb{font:500 11px var(--m);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.page h1{font:600 clamp(26px,3.4vw,36px)/1.12 var(--f);letter-spacing:-.04em;margin-top:8px}.page h1 span{color:var(--red)}
.ds{font-size:14.5px;color:var(--mute);margin-top:8px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.page h2{font:600 20px var(--f);letter-spacing:-.02em;margin:28px 0 12px}.page h2 span{font:500 12px var(--m);color:var(--red);margin-right:10px;vertical-align:3px}
.txt{max-width:640px;font-size:16px;line-height:1.75;color:#2B2F38}.txt p+p{margin-top:10px}
.txt mark{background:#FFF5F3;color:#C2412B;padding:1px 4px;border-radius:4px}
sup{color:var(--red);font:600 11px var(--m);margin-left:2px;cursor:pointer}
table{width:100%;max-width:640px;border-collapse:collapse;margin:18px 0;font-size:14.5px}
thead td{font:500 11px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0 0 10px}
td{padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td:not(:first-child){text-align:right}
td input{width:76px;font:500 14px var(--f);text-align:right;border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 7px;color:var(--fg)}
td input:hover{border-color:#C4C7CD}
tr.bad td{color:#C2412B;font-weight:600}tr.bad td input{color:#C2412B;border-color:#F0C4BB;background:#FFF5F3}
.fn{max-width:640px;margin-top:24px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.fn div{padding:5px 0 5px 10px;border-left:2px solid transparent}.fn div.on{border-color:var(--red);color:var(--fg);background:#F0F5FE}.fn b{font:600 11px var(--m);color:var(--red);margin-right:6px}
.hint{font-size:12.5px;color:#9AA0AA;margin-top:10px}
.cm h5{font:500 10.5px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.cc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;line-height:1.5;color:#4B5260}
.cc b{display:block;color:var(--fg);font:600 13.5px var(--f);margin-bottom:4px}.cc small{display:flex;justify-content:space-between;align-items:center;color:#9AA0AA;margin-top:10px;font-size:12px}
.cc button{background:#fff;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:4px 10px;font:500 12px var(--f);cursor:pointer}
.cc.res{opacity:.5}.cc.res p{text-decoration:line-through}
.nc{display:flex;flex-direction:column;gap:8px}.nc textarea{border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:14px var(--f);resize:vertical;min-height:70px}
.nc button{align-self:flex-end;background:var(--fg);border:1px solid var(--fg);color:#fff;font:600 13px var(--f);padding:9px 16px;border-radius:10px;cursor:pointer}
@media (max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.cm{grid-column:2;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){td input{width:58px;padding:4px 5px}thead td{letter-spacing:.04em;font-size:10px}.app{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{width:auto;white-space:nowrap}.rail h5,.ev{display:none}.mid{padding:16px 12px 30px}.cm{grid-column:1}}
@media print{.rail,.cm,.act,.hint{display:none!important}.app{display:block}.mid{padding:0;background:#fff}.page{border:0;padding:0}td input{border:0;background:none}}
</style></head><body>
<div class="app">
<aside class="rail"><div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2F6BDB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l7-3 7 3-7 3z"/><path d="M12 10v10M8 20h8"/></svg><div><b>LECTERN</b><small>GOVERNOR REPORTS</small></div></div><h5>Autumn 1 report</h5><nav class="nav" id="nav" aria-label="Report sections"></nav><h5>Evidence in this report</h5><div class="ev"><div>Attendance log, week 8</div><div>Learning walks, 14 Oct</div><div>Year 11 Mock 2</div></div></aside>
<main class="mid"><div class="act"><span id="sv"></span><button type="button" id="dr">Draft 3</button><button type="button" class="p" id="ex">Export report</button></div>
<article class="page" id="page"></article></main>
<aside class="cm" aria-label="Comments"><h5>Comments</h5><div id="cl"></div><div class="nc"><textarea id="ct" placeholder="Add a comment" aria-label="New comment"></textarea><button type="button" id="cb">Comment</button></div></aside>
</div>
<script>
(function(){
function pt(x){return(Math.round(x*10)/10)}
var SEC=[
{t:'Attendance and behaviour',rows:[['Attendance (%)',94.6,93.8,'up',1],['Persistent absence (%)',14.2,13.1,'down',1],['Suspensions',11,16,'down',0],['Permanent exclusions',0,1,'down',0]],
 note:['Attendance log, week 8. Figures update when the report is exported.','Contact log: 18 of 23 pupils. Names held in the school\'s records, not in this report.'],
 extra:'Twenty-three pupils are at risk of crossing the persistent absence threshold this month; eighteen already have a logged contact with home.<sup data-n="2">2</sup>'},
{t:'Teaching and learning',rows:[['Lesson observations completed',31,24,'up',0],['Secure or better (%)',87,81,'up',0],['Lessons showing adaptive teaching for SEND (%)',64,58,'up',0]],
 note:['Learning walk summary, 14 October.','Observations are recorded in Anaxi and counted automatically.'],
 extra:'Questioning is the strongest area. Adaptive teaching for pupils with SEND is the main development point.<sup data-n="1">1</sup>'},
{t:'Pupil outcomes',rows:[['Year 11 Mock 2: grade 4+ English and maths (%)',71,68,'up',0],['Year 11 Mock 2: grade 5+ English and maths (%)',52,49,'up',0],['Predicted Progress 8',0.12,0.04,'up',2]],
 note:['Year 11 Mock 2 results, entered by the data manager.','Predictions are an estimate, not a forecast of the final published figure.'],
 extra:'Gaps between disadvantaged pupils and their peers are reported separately in the Year 11 outcomes paper.<sup data-n="1">1</sup>'},
{t:'Finance',rows:[['In-year variance to budget (£k)',-42,-65,'up',0],['Staffing as a share of income (%)',81.5,83,'down',1],['Reserves (£k)',312,298,'up',0]],
 note:['Management accounts to the end of September.','Figures are reported in £ thousands.'],
 extra:'The finance committee will receive the full forecast in November.<sup data-n="1">1</sup>'},
{t:'Safeguarding',rows:[['Referrals this half-term',14,11,'neutral',0],['Staff with in-date training (%)',100,96,'up',0],['Single central record checks complete (%)',100,100,'up',0]],
 note:['Safeguarding log. No pupil is identified in this report.','Training record, week 7.'],
 extra:'Referrals have risen; this is consistent with improved reporting by staff, and each has been followed up by the designated lead.<sup data-n="1">1</sup>'}];
var cur=0,draft=3,edited=false,hl=0;
var cm=[{a:'Mrs Hall',t:'Rewritten to lead with the Monday pattern. Can you check the 14.2% against the DfE figure?',w:'Today, 07:31',r:0},{a:'Cllr Ahmed, governor',t:'Helpful. Can we see last year\'s persistent absence by year group at the meeting?',w:'Yesterday',r:0},{a:'Open question',t:'Staff retention in maths, from the last meeting.',w:'Still to answer',r:0}];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(v,d){return d?v.toFixed(d):String(v)}
function dir(r){var d=r[1]-r[2];if(Math.abs(d)<1e-9)return 0;return d>0?1:-1}
function bad(r){var d=dir(r);if(r[3]==='neutral'||!d)return false;return(r[3]==='up'&&d<0)||(r[3]==='down'&&d>0)}
function sentence(r,first){var d=pt(Math.abs(r[1]-r[2])*Math.pow(10,r[4]))/Math.pow(10,r[4]);var dd=r[4]?d.toFixed(r[4]):d;var lab=r[0].replace(/ \(.*\)/,'').replace(/^./,function(c){return c.toLowerCase()});
 var unit=/\(%\)/.test(r[0])?'%':'';var v=fmt(r[1],r[4])+unit;
 if(!dir(r))return 'Our '+lab+' is unchanged at '+v+'.';
 return 'Our '+lab+' stands at '+v+', '+dd+(unit?' points ':' ')+(dir(r)>0?'above':'below')+' this time last year.'}
function draw(){
 var S=SEC[cur];
 var nav=document.getElementById('nav');nav.innerHTML='';
 SEC.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.textContent=s.t;if(i===cur)b.setAttribute('aria-current','true');b.onclick=function(){cur=i;hl=0;draw()};nav.appendChild(b)});
 var worst=S.rows.filter(bad)[0];
 var h='<div class="eb">Autumn 1 report</div><h1>Headteacher\'s report to governors<span>.</span></h1><div class="ds">Autumn term, first half. For the meeting of Thursday 5 November.</div><h2><span>'+(cur+1)+'</span>'+esc(S.t)+'</h2><div class="txt"><p>';
 h+=S.rows.slice(0,2).map(function(r,i){return sentence(r,i===0)}).join(' ')+'<sup data-n="1">1</sup></p>';
 if(worst)h+='<p><mark>'+esc(worst[0].replace(/ \(.*\)/,''))+' has moved the wrong way.</mark> Governors may wish to ask what is driving the change and what the school is doing about it.</p>';
 h+='</div><table><thead><tr><td></td><td>This year</td><td>Last year</td><td>Change</td></tr></thead>';
 S.rows.forEach(function(r,i){var d=r[1]-r[2],ds=(d>0?'+':d<0?'−':'')+Math.abs(Math.round(d*100)/100);h+='<tr class="'+(bad(r)?'bad':'')+'"><td>'+esc(r[0])+'</td><td><input type="number" step="any" value="'+r[1]+'" data-i="'+i+'" data-k="1" aria-label="'+esc(r[0])+', this year"></td><td><input type="number" step="any" value="'+r[2]+'" data-i="'+i+'" data-k="2" aria-label="'+esc(r[0])+', last year"></td><td>'+ds+'</td></tr>'});
 h+='</table><div class="txt"><p>'+S.extra+'</p></div><div class="hint">Edit any figure in the table and the report text updates. Click a note number to see its evidence.</div>';
 h+='<div class="fn">'+S.note.map(function(n,i){return'<div class="'+(hl===i+1?'on':'')+'"><b>'+(i+1)+'</b> '+esc(n)+'</div>'}).join('')+'</div>';
 var pg=document.getElementById('page');pg.innerHTML=h;
 pg.querySelectorAll('input').forEach(function(inp){inp.onchange=function(){var v=parseFloat(inp.value);if(isNaN(v))return;S.rows[+inp.dataset.i][+inp.dataset.k]=v;touch();draw()}});
 pg.querySelectorAll('sup').forEach(function(s){s.onclick=function(){hl=+s.dataset.n;draw()}});
 document.getElementById('dr').textContent='Draft '+draft;
 renderCm()}
function touch(){if(!edited){edited=true;draft++}document.getElementById('sv').textContent='Saved just now'}
function renderCm(){var c=document.getElementById('cl');c.innerHTML='';
 cm.forEach(function(x,i){var d=document.createElement('div');d.className='cc'+(x.r?' res':'');d.innerHTML='<b>'+esc(x.a)+'</b><p>'+esc(x.t)+'</p><small><span>'+esc(x.w)+'</span><button type="button">'+(x.r?'Reopen':'Resolve')+'</button></small>';d.querySelector('button').onclick=function(){x.r=!x.r;renderCm()};c.appendChild(d)})}
document.getElementById('cb').onclick=function(){var t=document.getElementById('ct');var v=t.value.trim();if(!v)return;cm.unshift({a:'You',t:v,w:'Just now',r:0});t.value='';renderCm()};
document.getElementById('ex').onclick=function(){window.print()};
document.getElementById('dr').onclick=function(){draft++;edited=true;document.getElementById('sv').textContent='Saved as draft '+draft;document.getElementById('dr').textContent='Draft '+draft};
draw();
})();
</script></body></html>
