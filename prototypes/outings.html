<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--fg:#0F1115;--mute:#6B7280;--line:#E6E7EA;--hover:#F4F4F5;--red:#E5861A;--f:'Inter',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f);min-height:100vh}
button{font-family:var(--f);color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px 44px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}
.logo{display:flex;gap:12px;align-items:center}.logo b{display:block;font:700 15px var(--f);letter-spacing:.1em}.logo small{display:block;font:400 10px var(--m);letter-spacing:.14em;color:var(--mute)}
.tr{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tr button{border:0;background:none;border-radius:7px;padding:7px 14px;font:500 13px var(--f);cursor:pointer;color:#4B5260}
.tr button[aria-pressed=true]{background:var(--fg);color:#fff}
.eb{font:500 11px var(--m);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.ttl{padding:26px 0 22px}.ttl h1{font:600 clamp(30px,4vw,40px)/1.1 var(--f);letter-spacing:-.04em;margin-top:8px}.ttl h1 span{color:var(--red)}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,410px);gap:16px;align-items:start}
.mapc{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--hover);min-height:620px}
.mapc svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 10px;font:500 13px var(--f);display:flex;align-items:center;gap:8px;max-width:70%}
.pin i{flex:none;width:10px;height:10px;border-radius:2px;background:var(--fg)}.pin.o i{background:var(--red)}
.plan{position:absolute;left:16px;bottom:16px;width:min(370px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.plan h3{font:500 10.5px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.s{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:9px 0;font-size:14px;border-top:1px solid var(--line);align-items:center}
.s:first-of-type{border:0}.s b{font:500 12.5px var(--m);color:var(--fg)}
.s button{border:0;background:none;color:#9AA0AA;cursor:pointer;font-size:17px;padding:2px 6px;border-radius:6px}.s button:hover{color:var(--fg);background:var(--hover)}
.pa{display:flex;gap:6px;margin-top:10px}.pa input{min-width:0;flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 13.5px var(--f)}
.pa input[type=time]{flex:0 0 124px}.pa button{border:1px solid var(--fg);background:var(--fg);color:#fff;border-radius:8px;padding:8px 14px;font:600 13px var(--f);cursor:pointer}
.tk{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tk .h{background:#23262D;color:#fff;border-left:3px solid var(--red);padding:22px 24px 20px}
.tk .h small{font:500 10.5px var(--m);letter-spacing:.12em;text-transform:uppercase;color:#F6B567}
.tk .h h2{font:600 24px/1.15 var(--f);letter-spacing:-.03em;margin-top:8px}
.cut{display:none}
.tb{padding:20px 24px 24px}
.tm{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding-bottom:18px}
.tm div{font-size:13px;color:var(--mute)}.tm b{display:block;font:500 28px var(--f);color:var(--fg);letter-spacing:-.04em;margin-top:4px}
.pg{margin-top:18px;display:grid;gap:16px}
.pr{font-size:14px;font-weight:500}.pr span{float:right;color:var(--mute);font-weight:400}
.bar{height:6px;border-radius:4px;background:var(--hover);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--fg);transition:width .6s}.bar.o i{background:var(--red)}
.chase{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font:600 12px var(--f);cursor:pointer;margin-left:8px}.chase:disabled{opacity:.45;cursor:default}
.ck{display:flex;gap:10px;align-items:center;font:500 14px var(--f);cursor:pointer;padding:12px 0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.ck i{flex:none;width:20px;height:20px;border-radius:5px;border:1px solid #C4C7CD;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:12px}
.ck[aria-pressed=true] i{background:var(--fg);border-color:var(--fg)}
.rt{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;flex-wrap:wrap}
.rt button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.rt output{min-width:18px;text-align:center;font-weight:600}
.rt .ok{margin-left:auto;font:500 11.5px var(--f);border-radius:6px;padding:4px 9px}.good{background:#F1FAF4;color:#1E6B3C;border:1px solid #BFE3CC}.bad{background:#FFF7EC;color:#B4630A;border:1px solid #F6D3A6}
.go{margin-top:20px;display:block;width:100%;background:var(--fg);color:#fff;text-align:center;font:600 14.5px var(--f);padding:14px;border-radius:10px;border:1px solid var(--fg);cursor:pointer}
.go:disabled{background:var(--hover);border-color:var(--line);color:#9AA0AA;cursor:not-allowed}
.hint{margin-top:10px;font-size:13px;color:var(--mute);min-height:20px}
.stp{margin-top:16px;display:flex;gap:4px}.stp span{flex:1;height:4px;border-radius:2px;background:var(--hover)}.stp span.on{background:var(--fg)}
.stl{margin-top:8px;font:500 10.5px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
@media (max-width:960px){.g{grid-template-columns:1fr}.wrap{padding:0 16px 36px}.mapc{min-height:600px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
<div class="top"><div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E5861A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><div><b>OUTINGS</b><small>TRIPS AND VISITS</small></div></div><div class="tr" id="tr" role="group" aria-label="Choose a trip"></div></div>
<div class="ttl"><div class="eb">Trip planning</div><h1 id="tt"></h1></div><div class="g"><div class="mapc" id="mapc"></div><div class="tk" id="tk"></div></div></div>
<script>
(function(){
var TRIPS=[
{id:'sm',name:'Science Museum, London',grp:'Year 9',pupils:90,staff:9,date:'12 Mar',days:140,cost:14.5,cons:61,pay:72,dest:'Science Museum · 10:00',from:'Oakfield Academy · 08:30',
 plan:[['08:30','Coaches leave school'],['10:00','Arrive, split into 9 groups'],['12:30','Lunch in Hyde Park'],['14:15','Coaches leave London'],['15:30','Back at school']],ras:false,fa:2},
{id:'ph',name:'Peak District residential',grp:'Year 7',pupils:120,staff:10,date:'18 May',days:207,cost:186,cons:84,pay:61,dest:'Peak District centre · 13:00',from:'Oakfield Academy · 08:00',
 plan:[['08:00','Coaches leave school'],['13:00','Arrive and settle in'],['14:30','Orienteering in groups'],['18:00','Dinner and evening activity'],['21:30','Lights out']],ras:false,fa:1},
{id:'gl',name:'Shakespeare\'s Globe',grp:'Year 10',pupils:60,staff:6,date:'4 Nov',days:12,cost:22,cons:54,pay:51,dest:'Shakespeare\'s Globe · 13:30',from:'Oakfield Academy · 10:15',
 plan:[['10:15','Train from Bishop\'s Stortford'],['12:00','Lunch on the South Bank'],['13:30','Workshop and tour'],['16:00','Matinee performance'],['18:45','Back at school']],ras:true,fa:3}];
var S={};TRIPS.forEach(function(t){S[t.id]={cons:t.cons,pay:t.pay,chased:false,ras:t.ras,staff:t.staff,fa:t.fa,plan:t.plan.map(function(x){return x.slice()}),stage:0,msg:''}});
var cur=0;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '£'+n.toLocaleString('en-GB',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function fmtDays(t){return t.days+' days'}
function ratioOk(t,s){return t.pupils/s.staff<=10&&s.fa>=2}
function draw(){
 var t=TRIPS[cur],s=S[t.id];
 var tr=document.getElementById('tr');tr.innerHTML='';
 TRIPS.forEach(function(x,i){var b=document.createElement('button');b.type='button';b.textContent=x.name.split(',')[0].split(' ').slice(0,3).join(' ');b.setAttribute('aria-pressed',i===cur);b.onclick=function(){cur=i;draw()};tr.appendChild(b)});
 // map
 var k=cur;var ax=[1000,960,1040][k],ay=[840,800,860][k],bx=[900,980,820][k],by=[250,200,330][k];
 document.getElementById('tt').innerHTML=esc(t.name)+'<span>.</span>';var mp=document.getElementById('mapc');
 mp.innerHTML='<svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true"><rect width="1000" height="700" fill="#F4F4F5"/><path d="M-20 470 C 120 410 240 500 380 450 S 620 340 760 400 S 940 450 1040 370" stroke="#E6E7EA" stroke-width="90" stroke-linecap="round"/><ellipse cx="500" cy="190" rx="100" ry="60" fill="#EBECEE"/><ellipse cx="190" cy="170" rx="80" ry="50" fill="#EBECEE"/><ellipse cx="720" cy="590" rx="110" ry="54" fill="#EBECEE"/><g stroke="#fff" stroke-linecap="round"><path d="M0 80 L1000 140" stroke-width="10"/><path d="M0 300 L1000 230" stroke-width="12"/><path d="M0 610 L1000 540" stroke-width="9"/><path d="M130 0 L210 700" stroke-width="9"/><path d="M340 0 L420 700" stroke-width="12"/><path d="M590 0 L540 700" stroke-width="9"/><path d="M790 0 L860 700" stroke-width="10"/><path d="M240 0 L740 700" stroke-width="6"/><path d="M930 0 L470 700" stroke-width="6"/></g><path id="rt" d="M'+(ax/1.6)+' '+(ay/1.45)+' C 360 520 420 330 '+(bx/1.6)+' '+(by/1.45)+'" stroke="#0F1115" stroke-width="4" stroke-dasharray="2 15" stroke-linecap="round"/><circle cx="'+(ax/1.6)+'" cy="'+(ay/1.45)+'" r="9" fill="#0F1115" stroke="#fff" stroke-width="5"/><circle cx="'+(bx/1.6)+'" cy="'+(by/1.45)+'" r="9" fill="#E5861A" stroke="#fff" stroke-width="5"/></svg>'+
 '<div class="pin" style="left:'+(ax/1.6/10-4)+'%;top:'+(ay/1.45/7+1)+'%"><i></i>'+esc(t.from)+'</div><div class="pin o" style="left:'+(bx/1.6/10-12)+'%;top:'+(by/1.45/7-9)+'%"><i></i>'+esc(t.dest)+'</div>'+
 '<div class="plan"><h3>Plan for the day</h3>'+s.plan.map(function(p,i){return'<div class="s"><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span><button type="button" data-rm="'+i+'" aria-label="Remove '+esc(p[1])+'">×</button></div>'}).join('')+'<div class="pa"><input type="time" id="pt" value="12:00" aria-label="Time"><input id="px" placeholder="Add a stop" aria-label="New stop"><button type="button" id="pb">Add</button></div></div>';
 mp.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){s.plan.splice(+b.dataset.rm,1);draw()}});
 var add=function(){var v=document.getElementById('px').value.trim(),tm=document.getElementById('pt').value;if(!v||!tm)return;s.plan.push([tm,v]);s.plan.sort(function(a,b){return a[0]<b[0]?-1:1});draw()};
 document.getElementById('pb').onclick=add;document.getElementById('px').onkeydown=function(e){if(e.key==='Enter')add()};
 // ticket
 var rok=ratioOk(t,s),ready=s.ras&&rok&&s.cons>=t.pupils*0.9&&false;
 var allIn=s.cons>=t.pupils;
 var gate=s.ras&&rok;
 var tk=document.getElementById('tk');
 var steps=['Draft','Awaiting head','Approved'];
 tk.innerHTML='<div class="h"><small>'+t.grp+' · '+t.pupils+' pupils · '+s.staff+' staff</small><h2>Trip sheet</h2></div><div class="cut"></div><div class="tb">'+
 '<div class="tm"><div>Date<b>'+esc(t.date)+'</b></div><div style="text-align:right">Leaves in<b>'+fmtDays(t)+'</b></div></div><div class="pg">'+
 '<div class="pr">Consents<span>'+s.cons+' of '+t.pupils+'</span><button type="button" class="chase" id="cc" '+(s.chased||allIn?'disabled':'')+'>'+(allIn?'All in':s.chased?'Chased':'Chase '+(t.pupils-s.cons))+'</button><div class="bar o"><i style="width:'+Math.round(s.cons/t.pupils*100)+'%"></i></div></div>'+
 '<div class="pr">Payments<span>'+money(s.pay*t.cost)+' of '+money(t.pupils*t.cost)+'</span><div class="bar"><i style="width:'+Math.round(s.pay/t.pupils*100)+'%"></i></div></div>'+
 '<button type="button" class="ck" id="ras" aria-pressed="'+s.ras+'"><i>'+(s.ras?'✓':'')+'</i>Risk assessment signed off by trip lead</button>'+
 '<div class="rt"><span>Staff</span><button type="button" id="sm" aria-label="Fewer staff">−</button><output>'+s.staff+'</output><button type="button" id="sp" aria-label="More staff">+</button><span>First aiders</span><button type="button" id="fm" aria-label="Fewer first aiders">−</button><output>'+s.fa+'</output><button type="button" id="fp" aria-label="More first aiders">+</button><span class="ok '+(rok?'good':'bad')+'">1:'+Math.round(t.pupils/s.staff*10)/10+(rok?' · ok':' · needs more staff')+'</span></div></div>'+
 '<button class="go" id="go" '+(gate&&s.stage===0?'':'disabled')+'>'+(s.stage===0?'Send for approval':s.stage===1?'Waiting for the headteacher':'Approved')+'</button><div class="hint">'+(s.stage===0?(gate?'Everything needed is in place.':(s.ras?'':'Sign off the risk assessment. ')+(rok?'':'Staffing must be 1:10 or better with two first aiders.')):s.msg)+'</div>'+
 (s.stage===1?'<button type="button" class="chase" id="ap" style="margin:10px 0 0">Approve as headteacher</button>':'')+'<div class="stp">'+steps.map(function(x,i){return'<span class="'+(i<=s.stage?'on':'')+'"></span>'}).join('')+'</div><div class="stl">'+steps[s.stage]+'</div></div>';
 document.getElementById('cc').onclick=function(){s.chased=true;s.msg='';var n=0;draw();setTimeout(function(){var add=Math.min(t.pupils-s.cons,Math.round((t.pupils-s.cons)*0.35));s.cons+=add;s.chased=false;draw();var cc=document.getElementById('cc');},1400)};
 document.getElementById('ras').onclick=function(){s.ras=!s.ras;draw()};
 document.getElementById('sm').onclick=function(){s.staff=Math.max(1,s.staff-1);draw()};document.getElementById('sp').onclick=function(){s.staff=Math.min(30,s.staff+1);draw()};
 document.getElementById('fm').onclick=function(){s.fa=Math.max(0,s.fa-1);draw()};document.getElementById('fp').onclick=function(){s.fa=Math.min(10,s.fa+1);draw()};
 document.getElementById('go').onclick=function(){s.stage=1;s.msg='Sent to the headteacher for sign-off.';draw()};
 var ap=document.getElementById('ap');if(ap)ap.onclick=function(){s.stage=2;s.msg='Approved by the headteacher. Consent letters can now go to families.';draw()};
}
draw();
})();
</script></body></html>
